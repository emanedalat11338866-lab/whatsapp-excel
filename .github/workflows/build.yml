name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o WhatsAppToExcel.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd WhatsAppToExcel && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: WhatsAppToExcel/app/build/outputs/apk/debug/app-debug.apk
